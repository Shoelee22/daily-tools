<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="ClinicDesk — patient records, visit history and follow-up reminders for small clinics."/>
<title>ClinicDesk — Clinic Records</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <div class="brand-text">
      <h1>ClinicDesk</h1>
      <p>Patient Records</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="date-chip" id="clock" aria-label="Current date and time"></span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Clinic sections">
  <button class="tab is-active" role="tab" aria-selected="true" data-action="nav" data-view="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="tab" role="tab" aria-selected="false" data-action="nav" data-view="patients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><path d="M18 8v6M15 11h6"/></svg>
    <span>Patients</span>
  </button>
  <button class="tab" role="tab" aria-selected="false" data-action="nav" data-view="visits">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4M18 2v4"/><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M9 15l2 2 4-4"/></svg>
    <span>Visits</span>
  </button>
  <button class="tab" role="tab" aria-selected="false" data-action="nav" data-view="followups">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span>Follow-ups</span>
  </button>
  <button class="tab" role="tab" aria-selected="false" data-action="nav" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    <span>Settings</span>
  </button>
</nav>

<main id="view" aria-live="polite"></main>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="selftest-banner" hidden></div>

<script src="app.js"></script>
</body>
</html>
