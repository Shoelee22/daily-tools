<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevaDesk — Field Service Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="selftest-banner" hidden></div>
<div class="shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>
      </span>
      <span class="brand-name">SevaDesk</span>
      <span class="brand-sub">Field Service</span>
    </div>
    <nav class="nav">
      <button class="nav-btn is-active" data-view="dashboard" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-btn" data-view="board" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>
        Job Board
      </button>
      <button class="nav-btn" data-view="techs" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.3 4.7 2 5.5 4.9"/></svg>
        Technicians
      </button>
      <button class="nav-btn" data-view="amc" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        AMC Reminders
        <span class="nav-badge" id="amc-badge" hidden></span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <p class="foot-note">Data stays in this browser.<br>No account needed.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="view-title" id="view-title">Dashboard</h1>
        <p class="view-sub" id="view-sub">Today's shop floor at a glance</p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="zigzag" aria-hidden="true"></div>

    <section id="view-dashboard" class="view is-active" aria-label="Dashboard"></section>
    <section id="view-board" class="view" aria-label="Job board"></section>
    <section id="view-techs" class="view" aria-label="Technicians"></section>
    <section id="view-amc" class="view" aria-label="AMC reminders"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
